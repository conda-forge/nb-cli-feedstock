context:
  version: "0.0.9"

package:
  name: nb-cli
  version: ${{ version }}

source:
  url: https://github.com/jupyter-ai-contrib/nb-cli/archive/v${{ version }}.tar.gz
  sha256: 5b9ae39fe7d68c7b37ab2cc1eda36c4379b3818d1bc636263a9620409642ba06

build:
  number: 0

requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - cargo-bundle-licenses
    - cargo-auditable
    - pkg-config
  host:
    - openssl

tests:
  - script:
      - nb --help
      - nb --version

about:
  homepage: https://github.com/jupyter-ai-contrib/nb-cli
  repository: https://github.com/jupyter-ai-contrib/nb-cli
  license: BSD-3-Clause
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: "A command-line tool for reading, writing, and executing Jupyter notebooks"

extra:
  recipe-maintainers:
    - 3coins
    - andrii-i
    - ellisonbg
